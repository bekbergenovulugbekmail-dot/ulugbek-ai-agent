# What the browser actually sees.
#
# "Cannot reach the backend" in the console means `fetch` itself threw, which
# narrows the cause to the transport: a wrong compiled-in API URL, or a CORS
# response the browser refuses. Neither is visible from a terminal that cannot
# reach the deployment, and neither shows up in either service's own logs — a
# CORS block happens entirely in the browser, and the compiled URL is a string
# inside a JavaScript chunk.
#
# So this runs the same three checks a browser would, from a runner that can
# reach both services, and prints the evidence.

name: Deployment check

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Web service base URL"
        required: true
        default: "https://frontend-production-b432.up.railway.app"
      api_url:
        description: "API base URL, including /api"
        required: true
        default: "https://ulugbek-ai-agent-production.up.railway.app/api"
      agent_request:
        description: "Also send one real agent request (creates a run, spends tokens)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Can the deployed frontend reach the deployed backend
    runs-on: ubuntu-latest

    env:
      WEB: ${{ inputs.web_url }}
      API: ${{ inputs.api_url }}

    steps:
      - name: The backend answers at all
        run: |
          : > /tmp/failures
          echo "GET $API/health"
          code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$API/health" || echo 000)
          echo "  HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo
          case "$code" in
            200) echo "VERDICT: the backend is serving." ;;
            000) echo "VERDICT: no response at all - DNS, TLS or the host is unreachable."
                 echo "backend unreachable" >> /tmp/failures ;;
            502|503|504)
                 echo "VERDICT: HTTP $code comes from the platform edge, not from this"
                 echo "         application - the container is not serving. Nothing about"
                 echo "         the frontend can matter until this is fixed."
                 echo "backend HTTP $code" >> /tmp/failures ;;
            *)   echo "VERDICT: the application answered with HTTP $code."
                 echo "backend HTTP $code" >> /tmp/failures ;;
          esac

      - name: The web service answers at all
        run: |
          for path in /healthz /; do
            code=$(curl -sS --max-time 20 -o /tmp/web.out -w '%{http_code}' "$WEB$path" || echo 000)
            echo "GET $WEB$path -> HTTP $code"
          done

      # The decisive CORS check: the browser sends an Origin header and refuses
      # the response unless it is allowed back. curl does not enforce that, so
      # the headers are printed rather than trusted.
      - name: What the backend tells a browser on this origin
        run: |
          echo "--- simple request, Origin: $WEB"
          curl -sS --max-time 20 -D /tmp/h.txt -o /dev/null \
               -H "Origin: $WEB" "$API/health" || true
          grep -iE '^(HTTP/|access-control-|vary)' /tmp/h.txt || echo "  (no CORS headers at all)"
          echo
          echo "--- preflight, OPTIONS with Access-Control-Request-Method"
          curl -sS --max-time 20 -D /tmp/p.txt -o /dev/null -X OPTIONS \
               -H "Origin: $WEB" \
               -H "Access-Control-Request-Method: GET" \
               -H "Access-Control-Request-Headers: content-type" \
               "$API/health" || true
          grep -iE '^(HTTP/|access-control-|vary)' /tmp/p.txt || echo "  (no CORS headers at all)"
          echo
          status=$(grep -m1 -i '^HTTP/' /tmp/h.txt | awk '{print $2}')
          allowed=$(grep -i '^access-control-allow-origin' /tmp/h.txt | tr -d '\r' | cut -d' ' -f2- || true)
          case "${status:-000}" in
            502|503|504|000)
              # A service that does not answer sends no headers of any kind.
              # Reading that absence as a CORS misconfiguration sends whoever
              # is debugging it to the wrong file entirely.
              echo "VERDICT: the backend returned HTTP ${status:-none}, so it sent no"
              echo "         headers at all. CORS cannot be assessed from this and is"
              echo "         not the cause. Fix the backend, then re-run this check."
              ;;
            *)
              if [ -z "$allowed" ]; then
                echo "VERDICT: the backend answered but sent no Access-Control-Allow-Origin."
                echo "         A browser on $WEB will block every request, which is exactly"
                echo "         what 'Cannot reach the backend' looks like."
                echo "CORS: no Access-Control-Allow-Origin" >> /tmp/failures
              elif [ "$allowed" = "*" ] || [ "$allowed" = "$WEB" ]; then
                echo "VERDICT: CORS allows this origin ($allowed). Not the cause."
              else
                echo "VERDICT: the backend allows '$allowed', not '$WEB'."
                echo "CORS: allows $allowed, not the web origin" >> /tmp/failures
              fi
              ;;
          esac

      # The point of authentication is that it is on in production, and the
      # only way to know that is to ask production without a credential.
      - name: Does the API require a credential
        run: |
          echo "GET $API/system/overview  (no Authorization header)"
          code=$(curl -sS --max-time 20 -o /tmp/anon.json -w '%{http_code}' \
                 "$API/system/overview" || echo 000)
          echo "  HTTP $code"
          echo
          case "$code" in
            401) echo "VERDICT: the API refuses an anonymous caller." ;;
            503) echo "VERDICT: the API has no usable AUTH_TOKEN, so it is serving"
                 echo "         nothing but health. Set it on the API service."
                 echo "API has no usable AUTH_TOKEN" >> /tmp/failures ;;
            200) echo "VERDICT: the API answered an anonymous caller with data."
                 echo "         Anyone who finds this URL can run the agent."
                 echo "API is open to anonymous callers" >> /tmp/failures ;;
            *)   echo "VERDICT: unexpected HTTP $code."
                 echo "anonymous request answered HTTP $code" >> /tmp/failures ;;
          esac

          # The open endpoint says whether a token is configured at all, which
          # separates "closed" from "broken" without revealing anything.
          python3 - <<'EOF' || true
          import json
          try:
              auth = json.load(open("/tmp/health.json")).get("auth")
          except Exception:
              auth = None
          print(f"/health reports auth: {auth}")
          EOF

      # NEXT_PUBLIC_* values are compiled into the JavaScript, so the deployed
      # bundle is the only place the truth about them exists.
      - name: Which API URL is compiled into the deployed frontend
        run: |
          curl -fsS --max-time 20 "$WEB/" -o /tmp/index.html
          chunks=$(grep -o '/_next/static/chunks/[A-Za-z0-9._/-]*\.js' /tmp/index.html | sort -u)
          echo "chunks referenced by the page:"
          echo "$chunks" | sed 's/^/  /'
          echo
          : > /tmp/found.txt
          for c in $chunks; do
            curl -fsS --max-time 20 "$WEB$c" -o /tmp/chunk.js || continue
            grep -oE 'https?://[A-Za-z0-9._-]+(:[0-9]+)?/api' /tmp/chunk.js >> /tmp/found.txt || true
          done
          echo "API base URLs found inside the deployed bundle:"
          if [ -s /tmp/found.txt ]; then
            sort -u /tmp/found.txt | sed 's/^/  /'
          else
            echo "  (none found)"
          fi
          echo
          if grep -q "localhost:8000" /tmp/found.txt 2>/dev/null; then
            echo "VERDICT: the deployed bundle calls localhost. NEXT_PUBLIC_API_BASE_URL"
            echo "         was missing or wrong when this image was BUILT - changing it"
            echo "         now does nothing until the image is rebuilt."
            echo "bundle: built against localhost" >> /tmp/failures
          elif grep -qF "$API" /tmp/found.txt 2>/dev/null; then
            echo "VERDICT: the bundle calls $API - the compiled URL is correct."
          else
            echo "VERDICT: the bundle does not contain the expected API URL."
            echo "bundle: unexpected API URL" >> /tmp/failures
          fi

      # Everything above tests the plumbing. This tests the thing the
      # plumbing is for, through the endpoint the console actually uses:
      # POST /agent/runs returns immediately and the work happens in a
      # background task on its own database session — a different path from
      # the synchronous one, and one that can fail on its own.
      #
      # Opt-in: it creates a run and spends tokens.
      - name: One real agent request, the way the console makes it
        if: inputs.agent_request
        env:
          # The operator token, from repository secrets. It is never printed;
          # only whether it is present.
          OPERATOR_TOKEN: ${{ secrets.AUTH_TOKEN }}
        run: |
          if [ -z "$OPERATOR_TOKEN" ]; then
            echo "The AUTH_TOKEN secret is not set in this repository, so this"
            echo "check cannot authenticate. Add it under Settings -> Secrets"
            echo "with the same value as the API service's AUTH_TOKEN."
            echo "agent request: no AUTH_TOKEN secret to authenticate with" >> /tmp/failures
            exit 0
          fi

          marker="deployment-check-$(date -u +%Y%m%dT%H%M%SZ)"
          echo "POST $API/agent/runs  (Origin: $WEB)"
          code=$(curl -sS --max-time 60 -o /tmp/start.json -w '%{http_code}' \
                 -X POST "$API/agent/runs" \
                 -H "Authorization: Bearer $OPERATOR_TOKEN" \
                 -H 'content-type: application/json' \
                 -H "Origin: $WEB" \
                 -d "{\"message\":\"Reply with the single word: pong. ($marker)\"}" \
                 || echo 000)
          echo "  HTTP $code"
          python3 -m json.tool < /tmp/start.json 2>/dev/null || cat /tmp/start.json
          echo

          if [ "$code" != "202" ] && [ "$code" != "200" ]; then
            echo "VERDICT: the console's endpoint refused the request (HTTP $code)."
            echo "         The message above names what stopped it."
            echo "agent request rejected with HTTP $code" >> /tmp/failures
            exit 0
          fi

          run_id=$(python3 -c "import json;print(json.load(open('/tmp/start.json'))['run_id'])")
          echo "watching run $run_id"
          status=""
          for attempt in $(seq 1 40); do
            curl -fsS --max-time 15 -H "Authorization: Bearer $OPERATOR_TOKEN" \
                 "$API/agent/runs/$run_id" -o /tmp/run.json || true
            status=$(python3 -c "import json;print(json.load(open('/tmp/run.json')).get('status',''))" 2>/dev/null || true)
            if [ -n "$status" ] && [ "$status" != "RUNNING" ]; then break; fi
            sleep 3
          done
          python3 -c "import json;r=json.load(open('/tmp/run.json'));[print(f'  {k}: {r.get(k)}') for k in ('status','output','error','iterations','replans','tools_used')]"
          echo

          # One request must produce exactly one run. A console that started a
          # second on the same click would double every bill and side effect.
          curl -fsS --max-time 20 -H "Authorization: Bearer $OPERATOR_TOKEN" \
               "$API/agent/runs?limit=20" -o /tmp/runs.json || true
          matches=$(python3 -c "import json;print(sum(1 for r in json.load(open('/tmp/runs.json')) if '$marker' in (r.get('input') or '')))" 2>/dev/null || echo "?")
          echo "runs carrying this request's marker: $matches"

          if [ "$status" = "COMPLETED" ] && [ "$matches" = "1" ]; then
            echo "VERDICT: the console's endpoint reached Anthropic, the agent answered,"
            echo "         and the request produced exactly one run."
          else
            echo "VERDICT: status=$status, runs for this request=$matches (expected COMPLETED and 1)."
            echo "console-path run: status=$status, runs=$matches" >> /tmp/failures
          fi

      # A check that stays green while production is down is worse than no
      # check: it becomes a second thing to disbelieve.
      - name: Verdict
        if: always()
        run: |
          if [ -s /tmp/failures ]; then
            echo "The deployment is not healthy:"
            sed 's/^/  - /' /tmp/failures
            exit 1
          fi
          echo "Frontend and backend agree, and both answer."
