# Does the speech service actually work, and what does it cost?
#
# Nothing about a 514 MiB model can be checked from a laptop that cannot reach
# Hugging Face, and nothing about its latency can be guessed from a vendor page.
# This builds the image for real, starts it, and measures it — the numbers in
# docs/RUBAI_STT.md come from here and nowhere else.
#
# Separate from CI so the agent's own pipeline is never held up by a ten-minute
# model build.
#
# It also deploys the service, and only after both jobs above it are green --
# the guard's tests and an image that was built, started and made to transcribe
# for real. That is a stronger gate than either of the deploys in ci.yml gets.
#
# Dormant until the repository settings carry:
#   Secrets   -> RAILWAY_TOKEN         the same project token ci.yml uses
#   Variables -> RAILWAY_SERVICE_STT   the speech service's name or id
# While RAILWAY_SERVICE_STT is unset the deploy skips and prints the names of
# the services the token can reach, so the value can be copied rather than
# guessed.
#
# There is no health wait here, and that is deliberate rather than missing.
# The speech service is meant to have no public domain -- it is reached over
# Railway's private network and nothing else -- so there is no URL for CI to
# poll. Railway's own healthcheck is what gates the deployment instead:
# railway.json points it at /health, which stays 503 until the model actually
# answers, so a container that cannot load its model never takes traffic.

name: Rubai STT service

on:
  push:
    paths:
      - "services/rubai-stt/**"
      - ".github/workflows/rubai-stt.yml"
  pull_request:
    paths:
      - "services/rubai-stt/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: The service's own tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rubai-stt

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        # pytest-asyncio explicitly: the service's tests do not inherit the
        # repository root's configuration, and should not.
        run: pip install -r requirements.txt pytest pytest-asyncio

      # No model, no ffmpeg, seconds to run: the guard in front of the model is
      # what these cover, and it is the part that changes.
      - name: Tests
        run: python -m pytest tests/ -q

  measure:
    name: Build, run and measure
    runs-on: ubuntu-latest
    # The build downloads half a gigabyte and compiles whisper.cpp.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: |
          df -h / | tail -1
          time docker build -t rubai-stt:ci services/rubai-stt
          echo
          echo "image size:"
          docker image inspect rubai-stt:ci --format '{{.Size}}' \
            | awk '{printf "  %.0f MB\n", $1/1024/1024}'

      - name: Start it
        run: |
          docker run -d --name rubai \
            -e STT_SERVICE_TOKEN=ci-token-not-a-real-credential \
            -e PORT=8080 \
            -p 8080:8080 \
            rubai-stt:ci
          echo "waiting for the model to load"
          start=$(date +%s)
          for attempt in $(seq 1 90); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                   http://127.0.0.1:8080/health || echo 000)
            if [ "$code" = "200" ]; then
              echo "ready after $(( $(date +%s) - start ))s"
              cat /tmp/health.json; echo
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Model never became ready::/health stayed non-200."
          docker logs rubai | tail -50
          exit 1

      - name: It refuses a caller without the token
        run: |
          # The one property that matters if this service is ever reachable.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                 -F "file=@/dev/null" http://127.0.0.1:8080/inference || echo 000)
          echo "no token -> HTTP $code"
          [ "$code" = "401" ] || { echo "::error::expected 401"; exit 1; }

      - name: Transcribe, and time it
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq
          # Real speech, in English: this proves the pipeline end to end —
          # upload, ffmpeg, whisper, JSON back. It says nothing about Uzbek
          # accuracy, which needs real Uzbek recordings and is measured
          # separately in docs/RUBAI_STT_BENCHMARK.md.
          curl -fsSL -o /tmp/jfk.wav \
            https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          ffmpeg -loglevel error -i /tmp/jfk.wav -c:a libopus -f webm /tmp/jfk.webm -y
          ffmpeg -loglevel error -f lavfi -i anullsrc=r=16000:cl=mono -t 5 /tmp/5s.wav -y
          ffmpeg -loglevel error -f lavfi -i anullsrc=r=16000:cl=mono -t 30 /tmp/30s.wav -y

          measure() {
            name=$1; file=$2
            start=$(date +%s%3N)
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
                   -H "Authorization: Bearer ci-token-not-a-real-credential" \
                   -F "file=@$file" http://127.0.0.1:8080/inference || echo 000)
            elapsed=$(( $(date +%s%3N) - start ))
            echo "  $name: HTTP $code in ${elapsed}ms"
            if [ "$code" = "200" ]; then
              echo "    text: $(jq -r '.text' /tmp/out.json | head -c 160)"
              echo "    service-measured: $(jq -r '.latency_ms' /tmp/out.json)ms"
            else
              cat /tmp/out.json; echo
              echo "::error title=Transcription failed::$name answered HTTP $code"
              exit 1
            fi
          }

          echo "Latency (whisper pads every clip to 30s, so short audio is not cheap):"
          measure "jfk.wav  (11s speech)" /tmp/jfk.wav
          measure "jfk.webm (opus, what a browser sends)" /tmp/jfk.webm
          measure "silence  (5s)" /tmp/5s.wav
          measure "silence  (30s)" /tmp/30s.wav

      - name: What it costs to keep running
        if: always()
        run: |
          echo "runner: $(nproc) vCPU, $(free -m | awk '/Mem:/{print $2}') MB RAM"
          docker stats --no-stream --format \
            "  memory: {{.MemUsage}}   cpu: {{.CPUPerc}}" rubai || true

      - name: Logs, if anything went wrong
        if: failure()
        run: docker logs rubai | tail -80

      - name: Stop
        if: always()
        run: docker rm -f rubai || true

  deploy:
    name: Deploy the speech service to Railway
    # Both, not either: the tests say the guard is right and the measure job
    # says the image starts and transcribes. Shipping a model container that
    # was never started is how the last two deploys here went wrong.
    needs: [guard, measure]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production
    # Railway builds this image itself: half a gigabyte of weights to fetch and
    # whisper.cpp to compile, on a machine this job does not control.
    timeout-minutes: 45

    # Its own group. A speech deploy and an API deploy are separate services and
    # have no reason to block each other, but two speech deploys racing would
    # decide between themselves which image ends up live.
    concurrency:
      group: deploy-stt
      cancel-in-progress: false

    defaults:
      run:
        # `railway up` uploads the working directory, and this service is built
        # from services/rubai-stt/Dockerfile with its railway.json beside it.
        working-directory: services/rubai-stt

    steps:
      - uses: actions/checkout@v5

      - name: Check the deploy is configured
        id: guard
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_STT: ${{ vars.RAILWAY_SERVICE_STT }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "token=false" >> "$GITHUB_OUTPUT"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Speech deploy skipped::RAILWAY_TOKEN is not set."
          elif [ -z "${RAILWAY_SERVICE_STT}" ]; then
            echo "token=true" >> "$GITHUB_OUTPUT"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Speech deploy skipped::RAILWAY_SERVICE_STT is not set. Create the service in Railway and add its name as a repository variable."
          else
            echo "token=true" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The same helper the web deploy carries, for the same reason: "set a
      # variable" is a dead end when you do not know what to set it to. Service
      # names are not secret; the token is never printed.
      - name: Name the services this token can deploy
        if: steps.guard.outputs.token == 'true' && steps.guard.outputs.configured != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli@5 >/dev/null 2>&1 || true
          railway status --json > /tmp/status.json 2>/dev/null || true
          python3 - <<'PYEOF'
          import json

          def names(node, inside=False):
              found = []
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "name" and inside and isinstance(value, str):
                          found.append(value)
                      found += names(value, inside or key == "services")
              elif isinstance(node, list):
                  for item in node:
                      found += names(item, inside)
              return found

          try:
              found = sorted(set(names(json.load(open("/tmp/status.json")))))
          except Exception:
              found = []

          if found:
              print("Services in this Railway project:")
              for name in found:
                  print(f"  {name}")
              print()
              print("If the speech service is not in that list, create it first:")
          else:
              print("Could not read the service list from Railway.")
              print()
              print("Create the speech service in the Railway dashboard:")
          print("  New service -> Empty service, then Settings -> Root Directory")
          print("  = services/rubai-stt, and do NOT give it a public domain.")
          print()
          print("Then set its name as the RAILWAY_SERVICE_STT repository")
          print("variable (Settings -> Secrets and variables -> Actions ->")
          print("Variables) and run this workflow again.")
          PYEOF

      - name: Install the Railway CLI
        if: steps.guard.outputs.configured == 'true'
        run: npm install -g @railway/cli@5

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_SERVICE_STT }}" --ci

      - name: What still has to be true on the other side
        if: steps.guard.outputs.configured == 'true'
        run: |
          # Not a check -- this job cannot reach a service with no public
          # domain. It is the list of things whose absence makes the container
          # refuse to start or the API unable to use it, written where whoever
          # reads a deploy log will see it.
          cat <<'EOF'
          Deployed. Railway's own healthcheck decides whether it goes live:
          /health stays 503 until the model answers, so a container that cannot
          load its weights never takes traffic.

          On the speech service, these must be set or it will not start:
            STT_SERVICE_TOKEN     without it the service refuses to boot
            STT_LANGUAGE=uz
            STT_MAX_SECONDS=60
            STT_MAX_BYTES=10485760
            RUBAI_CONCURRENCY=1
            RUBAI_AUDIO_CTX=auto
            RUBAI_VAD=off

          On the API service:
            STT_PROVIDER=rubai
            STT_SERVICE_URL=http://<this service>.railway.internal:8080
            STT_SERVICE_TOKEN    the same value as above
            STT_TIMEOUT_SECONDS=150

          Memory: 870 MiB idle and 1.05 GiB under load were measured on a
          four-vCPU runner, so size this service above 1 GB.
          EOF
