# Local development stack: the API plus a PostgreSQL instance.
#
# Usage:
#   cp .env.example .env     # then set ANTHROPIC_API_KEY
#   docker compose up --build
#
# Already running PostgreSQL on 5432? Set POSTGRES_PORT in .env (e.g. 5433) and
# point DATABASE_URL at the same port — nothing else changes.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ulugbek
      POSTGRES_PASSWORD: ulugbek
      POSTGRES_DB: ulugbek_ai
    ports:
      # Host port is overridable; the container always listens on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulugbek -d ulugbek_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ulugbek:ulugbek@postgres:5432/ulugbek_ai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your .env}
      ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
      WEB_CONCURRENCY: 1
    ports:
      - "8000:8000"

volumes:
  postgres_data:
